note: >-
  Derived from what was actually probed at adordx.com on 2026-09-07. ADOR Diagnostics publishes no
  OpenAPI, AsyncAPI, GraphQL SDL, WSDL, protobuf or compliance program, so most cross-cutting
  standards are recorded as non-conforming for absence of a surface, not as a failure. No Compliance
  pointer is emitted: the company names no certification anywhere on its public site - the About and
  Technology pages carry no CE-IVD, IVDR, ISO 13485 or FDA claim, and there is no trust center.
domain_standard:
  market: in-vitro diagnostics / laboratory medicine
  candidates_checked:
  - HL7 v2 (ORU/ORM lab result messaging)
  - HL7 FHIR (DiagnosticReport / Observation)
  - LOINC coding
  - ASTM E1381/E1394 analyser-to-LIS
  - IHE LAW (Laboratory Analytical Workflow)
  conforms: false
  evidence: >-
    ADOR markets an "optional feature for connectivity between NATlab units located in various sites
    and geographical mapping of test results", but publishes no interface specification, no LIS
    integration guide and no message-format documentation for it. No HL7, FHIR, LOINC, ASTM or IHE
    profile is named on any public page (www.adordx.com/technology, /syndromic-panels, /about all
    fetched 200 and none names a standard). Reward-only dimension: absence is recorded, not
    penalised.
