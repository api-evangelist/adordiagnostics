apis:
- name: ADOR Diagnostics Site MCP
  description: >-
    A live, unauthenticated Model Context Protocol endpoint served from the www.adordx.com host and
    advertised in the company's own llms.txt. It is provided by the Wix site platform rather than
    authored by ADOR Diagnostics, and exposes nine tools over the public marketing site - business
    details, site search, site API-doc search, anonymous visitor-token minting, and generic Wix REST
    call/execute tools. No tool exposes the NATlab analyser, its cartridges, assay results or any
    ADOR diagnostic service; this is a site-content agent surface, not a product API.
  humanURL: https://www.adordx.com/llms.txt
