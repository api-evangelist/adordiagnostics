aid: adordiagnostics
name: ADOR Diagnostics
description: >-
  ADOR Diagnostics is an in-vitro diagnostics (IVD) company developing syndromic multiplex
  molecular diagnostics for infectious disease, headquartered in Guidonia Montecelio, Italy with
  operations in Israel and Cyprus. Its NATlab platform pairs a bench-top modular analyser with a
  disposable all-included microfluidic cartridge to run fully automated sample-to-answer testing of
  crude clinical specimens in roughly 30-60 minutes, detecting up to 100 multiplexed targets per
  sample. The assay chemistry is a patented isothermal rolling circle amplification (RCA) protocol
  read by a proprietary carbon array sensor embedded in the cartridge, rather than PCR, and the
  system is aimed at small and mid-sized laboratories, doctor offices, point-of-care and near-bed
  testing, rural labs and mobile care units. The company markets an optional connectivity feature
  linking NATlab units across sites for geographic mapping of results and outbreak detection, but
  publishes no technical documentation for it. ADOR is a diagnostics instrument and assay
  manufacturer, not a software vendor: it operates no developer program, publishes no public API,
  SDK or machine-readable API contract, and the only machine-readable surfaces on its own host are
  an llms.txt and the Wix-platform site MCP endpoint that llms.txt advertises.
