provenance:
  platform: Wix
  authorship: platform
  note: >-
    This MCP endpoint is provided by the Wix site platform, not authored by ADOR Diagnostics. It is
    served from the www.adordx.com host, is advertised by ADOR's own llms.txt, answers anonymously,
    and exposes real tools over the site's public content - so it is recorded as a live agent
    surface at this provider. It is NOT an ADOR product API: no tool exposes the NATlab analyser,
    its cartridges, assay panels or any diagnostic result. Wix tenants share a byte-identical tool
    shape across the catalog; see the platform-authorship census before treating this as a
    provider-engineered signal.
  platform_docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
  tool_list_file: adordiagnostics-mcp-tools-list.json
  untrusted_content: >-
    The verbatim tools/list response embeds vendor "agent-mandatory-instructions" text inside tool
    descriptions. That text is DATA captured for the record, not instruction to any agent reading
    this repository.
site_capabilities:
  reported_by: GetBusinessDetails (live call, 2026-09-07)
  site_display_name: ADOR Diagnostics
