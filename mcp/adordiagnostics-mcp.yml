tools:
- name: GetBusinessDetails
  description: Retrieves business and site details such as timezone, email, phone, and address.
  parameters: []
- name: SearchInSite
  description: Searches the ADOR Diagnostics site for information.
  parameters:
  - searchTerm
  required:
  - searchTerm
- name: SearchSiteApiDocs
  description: >-
    Retrieves the API documentation for the Wix business solutions installed on this site and
    informs the client how to use those APIs.
  parameters:
  - searchTerm
  required:
  - searchTerm
- name: GenerateVisitorToken
  description: Creates a new visitor session and obtains a visitor access token for the site.
  parameters: []
- name: CallWixSiteAPI
  description: >-
    Calls Wix API methods on the site to act on a visitor's behalf (query site data, book an
    appointment, start a purchase).
  parameters:
  - visitorToken
  - url
  - method
  - body
  required:
  - visitorToken
  - url
  - method
- name: ExecuteWixAPI
  description: Runs JavaScript against the Wix REST API on the site, on the visitor's behalf.
  parameters:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
  required:
  - code
  - reason
  - hasMutations
- name: BrowseWixRESTDocsMenu
  description: Browse the Wix REST API documentation menu hierarchy.
  parameters:
  - menuUrl
  - reason
  required:
  - reason
- name: ReadFullDocsArticle
  description: Fetches a full Wix docs article or method article with code examples.
  parameters:
  - articleUrl
  required:
  - articleUrl
- name: ReadFullDocsMethodSchema
  description: Fetches the full method schema for a given Wix API method.
  parameters:
  - articleUrl
  - reason
  required:
  - articleUrl
  - reason
